<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 1900" font-family="Arial, Helvetica, sans-serif">
  <!-- ============================================================
       专利 A1 附图（线稿草案，供代理人照画正式图）
       规范：黑线白底、参考标号+引线、每个 FIG 一张正式图纸。
       标号对照说明书：100系统 110处理器 120存储器 130显示 140打印机
       142打印头 200源图像 361/362/363 Or/Gr/V仪表 365历史曲线
       370建议条 380重选意图可操作项 320色相范围 330可达性上限 340超出量
       ============================================================ -->
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#000"/>
    </marker>
  </defs>
  <style>
    .b{fill:none;stroke:#000;stroke-width:1.5}
    .t{font-size:13px;fill:#000}
    .n{font-size:13px;fill:#000;font-weight:bold}
    .ln{stroke:#000;stroke-width:1}
    .cap{font-size:15px;fill:#000;font-weight:bold}
    .arrow{fill:none;stroke:#000;stroke-width:1.5;marker-end:url(#arr)}
    .dash{fill:none;stroke:#000;stroke-width:1;stroke-dasharray:4 3}
  </style>

  <!-- ================= FIG. 1  系统框图 ================= -->
  <g transform="translate(0,20)">
    <text x="410" y="14" text-anchor="middle" class="cap">图 1  /  FIG. 1</text>
    <!-- system box 100 -->
    <rect x="60" y="40" width="430" height="170" class="b"/>
    <text x="70" y="60" class="t">光栅图像处理系统</text><text x="455" y="60" class="n">100</text>
    <rect x="90" y="80" width="160" height="46" class="b"/><text x="105" y="108" class="t">处理器</text><text x="240" y="98" class="n">110</text>
    <rect x="300" y="80" width="160" height="46" class="b"/><text x="315" y="108" class="t">存储器</text><text x="450" y="98" class="n">120</text>
    <rect x="90" y="146" width="370" height="46" class="b"/><text x="105" y="174" class="t">显示装置</text><text x="450" y="164" class="n">130</text>
    <!-- printer 140 -->
    <rect x="600" y="70" width="170" height="120" class="b"/>
    <text x="615" y="92" class="t">扩展色域打印机</text><text x="735" y="92" class="n">140</text>
    <rect x="625" y="110" width="120" height="34" class="b"/><text x="640" y="132" class="t">打印头</text><text x="735" y="128" class="n">142</text>
    <text x="615" y="170" class="t">C M Y K + Or/Gr/V</text>
    <line class="arrow" x1="490" y1="130" x2="600" y2="130"/>
    <!-- source image 200 in -->
    <rect x="60" y="240" width="120" height="40" class="b"/><text x="78" y="265" class="t">源图像</text><text x="165" y="258" class="n">200</text>
    <line class="arrow" x1="120" y1="240" x2="120" y2="210"/>
    <text x="600" y="235" class="t">→ 实体印张</text>
    <line class="arrow" x1="685" y1="190" x2="685" y2="225"/>
  </g>

  <!-- ================= FIG. 2  方法流程图 ================= -->
  <g transform="translate(0,330)">
    <text x="410" y="14" text-anchor="middle" class="cap">图 2  /  FIG. 2</text>
    <rect x="250" y="35" width="320" height="40" rx="4" class="b"/><text x="265" y="60" class="t">S110 获取源图像</text>
    <rect x="220" y="100" width="380" height="56" rx="4" class="b"/>
    <text x="235" y="122" class="t">S120 分析图像内容：像素按色相/彩度，</text>
    <text x="235" y="142" class="t">相对 CMYK 可达性上限分类，累计超出量 → 调用率度量</text>
    <rect x="250" y="181" width="320" height="40" rx="4" class="b"/><text x="265" y="206" class="t">S130 呈现各扩展墨调用率仪表</text>
    <polygon points="410,246 540,286 410,326 280,286" class="b"/><text x="360" y="290" class="t">S140 满足条件?</text>
    <rect x="600" y="266" width="200" height="56" rx="4" class="b"/>
    <text x="612" y="288" class="t">呈现建议 + 重选</text><text x="612" y="306" class="t">渲染意图可操作项</text>
    <rect x="600" y="345" width="200" height="40" rx="4" class="b"/><text x="612" y="370" class="t">S150 重选 → 重算重呈</text>
    <rect x="250" y="360" width="320" height="40" rx="4" class="b"/><text x="265" y="385" class="t">S160 打印 → 沉积油墨 → 实体印张</text>
    <line class="arrow" x1="410" y1="75" x2="410" y2="100"/>
    <line class="arrow" x1="410" y1="156" x2="410" y2="181"/>
    <line class="arrow" x1="410" y1="221" x2="410" y2="246"/>
    <line class="arrow" x1="540" y1="286" x2="600" y2="286"/><text x="548" y="280" class="t">是</text>
    <line class="arrow" x1="410" y1="326" x2="410" y2="360"/><text x="418" y="345" class="t">否</text>
    <!-- loop S150 -> S120/S130 -->
    <path class="arrow" d="M700,345 L700,209 L570,209"/>
    <text x="705" y="240" class="t">闭环重估</text>
  </g>

  <!-- ================= FIG. 3  三仪表 + 建议条 UI ================= -->
  <g transform="translate(0,800)">
    <text x="410" y="14" text-anchor="middle" class="cap">图 3  /  FIG. 3（界面示意，指定为摘要附图）</text>
    <rect x="120" y="40" width="580" height="240" class="b"/>
    <text x="140" y="64" class="t">扩展色域调用率</text>
    <!-- meter Or 361 -->
    <text x="140" y="100" class="t">Or 橙</text>
    <rect x="220" y="88" width="320" height="16" class="b"/><rect x="220" y="88" width="262" height="16" fill="#000"/>
    <text x="552" y="101" class="t">82%</text><text x="600" y="101" class="n">361</text>
    <!-- meter Gr 362 -->
    <text x="140" y="140" class="t">Gr 绿</text>
    <rect x="220" y="128" width="320" height="16" class="b"/><rect x="220" y="128" width="0" height="16" fill="#000"/>
    <text x="552" y="141" class="t">0%</text><text x="600" y="141" class="n">362</text>
    <!-- meter V 363 -->
    <text x="140" y="180" class="t">V 紫</text>
    <rect x="220" y="168" width="320" height="16" class="b"/><rect x="220" y="168" width="0" height="16" fill="#000"/>
    <text x="552" y="181" class="t">0%</text><text x="600" y="181" class="n">363</text>
    <!-- sparkline 365 -->
    <polyline class="ln" points="220,212 245,206 270,210 295,200 320,205 345,198 370,203"/>
    <text x="378" y="212" class="t">历史曲线</text><text x="600" y="212" class="n">365</text>
    <!-- advisory bar 370 + affordance 380 -->
    <rect x="140" y="232" width="430" height="34" class="b"/>
    <text x="152" y="254" class="t">⚠ 扩展色基本未用，建议重选渲染意图 / 更换源文件</text>
    <text x="520" y="228" class="n">370</text><line class="ln" x1="525" y1="231" x2="540" y2="240"/>
    <rect x="578" y="234" width="110" height="30" class="b"/><text x="590" y="254" class="t">重选意图 ▸</text>
    <text x="640" y="226" class="n">380</text><line class="ln" x1="645" y1="229" x2="635" y2="238"/>
  </g>

  <!-- ================= FIG. 4  色相—可达性上限—超出量 ================= -->
  <g transform="translate(0,1110)">
    <text x="410" y="14" text-anchor="middle" class="cap">图 4  /  FIG. 4</text>
    <!-- axes -->
    <line class="b" x1="120" y1="250" x2="720" y2="250"/>
    <line class="b" x1="120" y1="250" x2="120" y2="50"/>
    <text x="95" y="60" class="t">C*</text>
    <text x="690" y="270" class="t">色相 h(°)</text>
    <text x="60" y="150" class="t">彩度</text>
    <!-- reachability limit curve 330 (CMYK ceiling, dips at O/G/V) -->
    <path class="ln" d="M120,150 C200,120 250,190 320,185 C390,180 430,110 500,150 C560,185 600,150 650,120 L720,135"/>
    <text x="250" y="205" class="t">CMYK 可达性上限</text><text x="395" y="205" class="n">330</text>
    <!-- hue range band 320 (orange) -->
    <rect x="170" y="50" width="70" height="200" class="dash"/>
    <text x="160" y="44" class="t">与某扩展墨关联的色相范围</text><text x="350" y="44" class="n">320</text>
    <!-- pixel point above curve + excess 340 -->
    <circle cx="205" cy="80" r="4" fill="#000"/>
    <text x="214" y="78" class="t">像素 (h, C*)</text>
    <line class="arrow" x1="205" y1="165" x2="205" y2="86"/>
    <line class="arrow" x1="205" y1="92" x2="205" y2="160"/>
    <text x="120" y="120" class="t">超出量</text><text x="172" y="120" class="n">340</text>
    <text x="200" y="270" class="t">→ 落入 320 且 C* 超 330 ⇒ 调用该墨，量 ∝ 340</text>
  </g>

  <!-- ================= FIG. 5  提示—重选—重估 闭环 ================= -->
  <g transform="translate(0,1500)">
    <text x="410" y="14" text-anchor="middle" class="cap">图 5  /  FIG. 5（闭环）</text>
    <rect x="120" y="60" width="150" height="50" rx="6" class="b"/><text x="140" y="82" class="t">S120 估计</text><text x="140" y="100" class="t">调用率</text>
    <rect x="350" y="60" width="150" height="50" rx="6" class="b"/><text x="370" y="90" class="t">S130 呈现仪表</text><text x="455" y="55" class="n">361-363</text>
    <rect x="580" y="60" width="150" height="50" rx="6" class="b"/><text x="600" y="90" class="t">建议条</text><text x="700" y="55" class="n">370</text>
    <rect x="580" y="190" width="150" height="50" rx="6" class="b"/><text x="600" y="220" class="t">重选渲染意图</text><text x="700" y="255" class="n">380</text>
    <line class="arrow" x1="270" y1="85" x2="350" y2="85"/>
    <line class="arrow" x1="500" y1="85" x2="580" y2="85"/>
    <line class="arrow" x1="655" y1="110" x2="655" y2="190"/>
    <path class="arrow" d="M580,215 L195,215 L195,110"/>
    <text x="300" y="208" class="t">重选后回到 S120 实时重估（闭环）</text>
  </g>
</svg>
