<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 1900" font-family="Arial, Helvetica, sans-serif">
  <!-- ============================================================
       专利 A2 附图（线稿草案，供代理人照画正式图）
       标号对照说明书：100系统 110处理器 120存储器 130显示 140打印机
       150测量仪器 200验证目标(201灰阶 202单通道阶调 203色块 204扩展色相梯度)
       210测量数据 220诊断度量(221中性轴色度偏移 222单通道线性度
       223总体/记忆色色差 224扩展墨覆盖偏差) 300映射结构 310被识别阶段
       320一键导航控件 410墨量限制 420线性化 430灰平衡 440ICC 450意图/调用
       （建档顺序：线性化420 先于 灰平衡430；列印套用顺序相反）
       ============================================================ -->
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#000"/>
    </marker>
  </defs>
  <style>
    .b{fill:none;stroke:#000;stroke-width:1.5}
    .t{font-size:13px;fill:#000}
    .n{font-size:13px;fill:#000;font-weight:bold}
    .ln{stroke:#000;stroke-width:1}
    .cap{font-size:15px;fill:#000;font-weight:bold}
    .arrow{fill:none;stroke:#000;stroke-width:1.5;marker-end:url(#arr)}
    .dash{fill:none;stroke:#000;stroke-width:1;stroke-dasharray:4 3}
  </style>

  <!-- ================= FIG. 1  系统框图 ================= -->
  <g transform="translate(0,20)">
    <text x="410" y="14" text-anchor="middle" class="cap">图 1  /  FIG. 1</text>
    <rect x="60" y="40" width="430" height="170" class="b"/>
    <text x="70" y="60" class="t">打印校准验证系统</text><text x="455" y="60" class="n">100</text>
    <rect x="90" y="80" width="160" height="46" class="b"/><text x="105" y="108" class="t">处理器</text><text x="240" y="98" class="n">110</text>
    <rect x="300" y="80" width="160" height="46" class="b"/><text x="315" y="108" class="t">存储器</text><text x="450" y="98" class="n">120</text>
    <rect x="90" y="146" width="370" height="46" class="b"/><text x="105" y="174" class="t">显示装置</text><text x="450" y="164" class="n">130</text>
    <rect x="600" y="55" width="170" height="56" class="b"/><text x="615" y="88" class="t">打印机</text><text x="735" y="78" class="n">140</text>
    <rect x="600" y="140" width="170" height="56" class="b"/><text x="615" y="173" class="t">测量仪器</text><text x="735" y="163" class="n">150</text>
    <line class="arrow" x1="490" y1="83" x2="600" y2="83"/>
    <line class="arrow" x1="600" y1="168" x2="490" y2="168"/>
    <text x="500" y="78" class="t">打印</text><text x="500" y="162" class="t">测量</text>
  </g>

  <!-- ================= FIG. 2  多阶段管线 + 闭环总览 ================= -->
  <g transform="translate(0,250)">
    <text x="410" y="14" text-anchor="middle" class="cap">图 2  /  FIG. 2（总览）</text>
    <!-- ordered stages -->
    <rect x="40" y="50" width="120" height="50" class="b"/><text x="55" y="72" class="t">墨量限制</text><text x="120" y="92" class="t">TIL</text><text x="60" y="44" class="n">410</text>
    <rect x="190" y="50" width="120" height="50" class="b"/><text x="205" y="72" class="t">逐通道</text><text x="205" y="92" class="t">线性化</text><text x="210" y="44" class="n">420</text>
    <rect x="340" y="50" width="120" height="50" class="b"/><text x="355" y="72" class="t">灰平衡</text><text x="365" y="92" class="t">G7</text><text x="360" y="44" class="n">430</text>
    <rect x="490" y="50" width="120" height="50" class="b"/><text x="505" y="80" class="t">ICC 配置</text><text x="510" y="44" class="n">440</text>
    <rect x="640" y="50" width="140" height="50" class="b"/><text x="650" y="72" class="t">意图/扩展色</text><text x="655" y="92" class="t">域调用</text><text x="660" y="44" class="n">450</text>
    <line class="arrow" x1="160" y1="75" x2="190" y2="75"/>
    <line class="arrow" x1="310" y1="75" x2="340" y2="75"/>
    <line class="arrow" x1="460" y1="75" x2="490" y2="75"/>
    <line class="arrow" x1="610" y1="75" x2="640" y2="75"/>
    <!-- verify + closed loop -->
    <rect x="300" y="160" width="220" height="44" class="b"/><text x="312" y="187" class="t">打印+测量验证 → 自动定位失败阶段</text>
    <line class="arrow" x1="410" y1="100" x2="410" y2="160"/>
    <path class="arrow" d="M300,182 L80,182 L80,100"/>
    <text x="120" y="176" class="t">仅重做被识别阶段（闭环）</text>
    <path class="dash" d="M520,182 L750,182 L750,100"/>
  </g>

  <!-- ================= FIG. 3  方法流程图 ================= -->
  <g transform="translate(0,520)">
    <text x="410" y="14" text-anchor="middle" class="cap">图 3  /  FIG. 3</text>
    <rect x="240" y="35" width="340" height="40" rx="4" class="b"/><text x="252" y="60" class="t">S210 打印验证目标 + 测量 → 测量数据</text>
    <rect x="240" y="95" width="340" height="40" rx="4" class="b"/><text x="252" y="120" class="t">S220 计算各分阶段诊断度量</text>
    <polygon points="410,158 560,196 410,234 260,196" class="b"/><text x="365" y="200" class="t">合格?</text>
    <rect x="610" y="176" width="180" height="40" rx="4" class="b"/><text x="622" y="201" class="t">S230 归因到某阶段</text>
    <rect x="610" y="236" width="180" height="40" rx="4" class="b"/><text x="622" y="261" class="t">S240 定向重校该阶段</text>
    <rect x="610" y="296" width="180" height="40" rx="4" class="b"/><text x="622" y="321" class="t">S250 仅重验该项</text>
    <rect x="250" y="255" width="320" height="40" rx="4" class="b"/><text x="262" y="280" class="t">打印 → 实体印张（满足判据）</text>
    <line class="arrow" x1="410" y1="75" x2="410" y2="95"/>
    <line class="arrow" x1="410" y1="135" x2="410" y2="158"/>
    <line class="arrow" x1="410" y1="234" x2="410" y2="255"/><text x="418" y="250" class="t">是</text>
    <line class="arrow" x1="560" y1="196" x2="610" y2="196"/><text x="566" y="190" class="t">否</text>
    <line class="arrow" x1="700" y1="216" x2="700" y2="236"/>
    <line class="arrow" x1="700" y1="276" x2="700" y2="296"/>
    <!-- loop S250 -> S230 -->
    <path class="arrow" d="M790,316 L800,196 L790,196"/>
    <text x="700" y="356" class="t">仍不合格→回 S230</text>
  </g>

  <!-- ================= FIG. 4  失败签名 → 阶段 映射（旗舰图）========= -->
  <g transform="translate(0,920)">
    <text x="410" y="14" text-anchor="middle" class="cap">图 4  /  FIG. 4（指定为摘要附图）</text>
    <!-- metrics 220 -->
    <text x="60" y="45" class="t">诊断度量</text><text x="135" y="45" class="n">220</text>
    <rect x="60" y="60" width="220" height="34" class="b"/><text x="72" y="82" class="t">221 中性轴色度偏移</text>
    <rect x="60" y="104" width="220" height="34" class="b"/><text x="72" y="126" class="t">222 单通道密度线性度</text>
    <rect x="60" y="148" width="220" height="34" class="b"/><text x="72" y="170" class="t">223 总体/记忆色 ΔE</text>
    <rect x="60" y="192" width="220" height="34" class="b"/><text x="72" y="214" class="t">224 扩展墨覆盖偏差</text>
    <!-- mapping structure 300 -->
    <rect x="340" y="90" width="140" height="110" class="b"/>
    <text x="352" y="135" class="t">失败签名→</text><text x="352" y="155" class="t">阶段 映射结构</text>
    <text x="352" y="175" class="t">(决策表/分类器)</text>
    <text x="385" y="84" class="n">300</text>
    <!-- identified stage 310 -->
    <rect x="560" y="128" width="180" height="40" class="b"/><text x="572" y="153" class="t">被识别阶段</text><text x="700" y="123" class="n">310</text>
    <!-- arrows metrics -> mapping -->
    <line class="arrow" x1="280" y1="77" x2="340" y2="120"/>
    <line class="arrow" x1="280" y1="121" x2="340" y2="135"/>
    <line class="arrow" x1="280" y1="165" x2="340" y2="160"/>
    <line class="arrow" x1="280" y1="209" x2="340" y2="180"/>
    <line class="arrow" x1="480" y1="148" x2="560" y2="148"/>
    <!-- example mapping legend -->
    <text x="60" y="270" class="t">示例映射：221↑ → 430 灰平衡 ; 222 异常 → 420 线性化 ;</text>
    <text x="60" y="290" class="t">223 偏大/偏色 → 440 ICC（并查 410）; 224 显著 → 450 意图/调用</text>
  </g>

  <!-- ================= FIG. 5  引导界面 ================= -->
  <g transform="translate(0,1250)">
    <text x="410" y="14" text-anchor="middle" class="cap">图 5  /  FIG. 5（引导界面）</text>
    <rect x="180" y="50" width="460" height="170" class="b"/>
    <text x="200" y="78" class="t">验证不合格 —— 已定位</text>
    <rect x="200" y="96" width="420" height="44" class="b"/>
    <text x="212" y="123" class="t">重做阶段：420 逐通道线性化（单通道密度非线性）</text>
    <text x="630" y="118" class="n">310</text>
    <rect x="200" y="156" width="180" height="40" class="b"/><text x="212" y="181" class="t">▸ 前往该阶段</text>
    <text x="390" y="180" class="n">320</text>
    <rect x="410" y="156" width="210" height="40" class="b"/><text x="422" y="181" class="t">（其余阶段不动）</text>
  </g>
</svg>
